name: Build Custom RustDesk for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      RUST_VERSION: "1.75.0"
      LLVM_VERSION: "15.0.6"
      FLUTTER_VERSION: "3.24.5"
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static

    steps:
      - name: Checkout source code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust (with rustfmt for frb)
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: rustdesk -> target

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Bootstrap vcpkg
        shell: cmd
        run: |
          if not exist C:\vcpkg\vcpkg.exe (
            if not exist C:\vcpkg (
              echo Cloning vcpkg...
              git clone --depth=1 https://github.com/microsoft/vcpkg C:\vcpkg
            )
            cd /d C:\vcpkg
            echo Bootstrapping vcpkg...
            call bootstrap-vcpkg.bat -disableMetrics
          )
          C:\vcpkg\vcpkg.exe --version
        timeout-minutes: 10

      - name: Install vcpkg dependencies
        shell: cmd
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk
          REM rustdesk's aom overlay (res/vcpkg/aom/aom-install.diff) breaks on cmake 4.x
          REM (latest vcpkg bootstrap pulls cmake 4.4.0). Temporarily move aom overlay out
          REM so vcpkg uses its built-in aom (cmake-4 compatible). Restore after install.
          if exist res\vcpkg\aom (
            echo Disabling rustdesk aom overlay (cmake 4.x incompatible)...
            move res\vcpkg\aom res\vcpkg\aom.disabled-cmake4
          )
          echo === vcpkg install (manifest mode from rustdesk/vcpkg.json) ===
          C:\vcpkg\vcpkg.exe install --triplet=x64-windows-static --x-install-root=C:\vcpkg\installed
          set RC=%errorlevel%
          if exist res\vcpkg\aom.disabled-cmake4 (
            move res\vcpkg\aom.disabled-cmake4 res\vcpkg\aom
          )
          if not %RC%==0 (
            echo ##[error]vcpkg install failed with exit code %RC%
            exit /b %RC%
          )
          REM Sanity check: ffmpeg headers must be present in target triplet dir
          if not exist C:\vcpkg\installed\x64-windows-static\include\libavutil\attributes.h (
            echo ##[error]FATAL: ffmpeg headers missing
            echo installed triplets:
            dir C:\vcpkg\installed\
            if exist C:\vcpkg\installed\x64-windows-static\include (
              dir C:\vcpkg\installed\x64-windows-static\include\
            )
            exit /b 1
          )
          echo === vcpkg install OK, ffmpeg headers verified ===
        timeout-minutes: 90

      - name: Install flutter_rust_bridge_codegen
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Fetch Flutter dependencies
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk\flutter
          flutter pub get

      - name: Generate flutter_rust_bridge code
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk\flutter
          set PATH=%USERPROFILE%\.cargo\bin;%PATH%
          flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output ./lib/generated_bridge.dart --c-output ./windows/runner/bridge_generated.h

      - name: Build RustDesk (portable + flutter + hwcodec + vram)
        shell: cmd
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk
          echo === Starting cargo build ===
          python build.py --portable --flutter --hwcodec --vram --skip-portable-pack
          if errorlevel 1 (
            echo ##[error]build.py failed
            exit /b 1
          )
          if not exist flutter\build\windows\x64\runner\Release (
            echo ##[error]flutter Release dir not found
            dir flutter\build\windows\x64\runner\
            exit /b 1
          )
          move /Y flutter\build\windows\x64\runner\Release rustdesk
        timeout-minutes: 120

      - name: Download usbmmidd driver
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk\rustdesk
          curl -L -o usbmmidd_v2.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          powershell -Command "Expand-Archive usbmmidd_v2.zip -DestinationPath ."
          powershell -Command "Remove-Item -Recurse -Force usbmmidd\Win32"
          powershell -Command "Remove-Item usbmmidd\deviceinstaller64.exe, usbmmidd\deviceinstaller.exe, usbmmidd\usbmmidd.bat"
          move /Y usbmmidd .
        timeout-minutes: 5

      - name: Download printer drivers
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk\rustdesk
          curl -L -o rustdesk_printer_driver.zip https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip
          curl -L -o printer_driver_adapter.zip https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip
          mkdir drivers
          powershell -Command "Expand-Archive rustdesk_printer_driver.zip -DestinationPath ."
          powershell -Command "Expand-Archive printer_driver_adapter.zip -DestinationPath ."
          move /Y rustdesk_printer_driver_v4-1.4 drivers\RustDeskPrinterDriver
          move /Y printer_driver_adapter.dll .
          del rustdesk_printer_driver.zip printer_driver_adapter.zip
        timeout-minutes: 5

      - name: Build self-extracting single-file portable
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk
          sed -i '/dpiAware/d' res\manifest.xml
          cd /d rustdesk\libs\portable
          pip install -r requirements.txt
          python generate.py -f ..\..\rustdesk\ -o . -e ..\..\rustdesk\rustdesk.exe
          if not exist target\release\rustdesk-portable-packer.exe (
            echo ##[error]Portable packer build failed
            exit /b 1
          )
          mkdir %GITHUB_WORKSPACE%\output
          move /Y target\release\rustdesk-portable-packer.exe %GITHUB_WORKSPACE%\output\rustdesk-1.4.9-x86_64.exe
        timeout-minutes: 15

      - name: Verify output
        shell: cmd
        run: |
          dir %GITHUB_WORKSPACE%\output
          dir %GITHUB_WORKSPACE%\rustdesk\rustdesk\rustdesk.exe

      - name: Upload single-file portable
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-portable
          path: output/rustdesk-1.4.9-x86_64.exe
          if-no-files-found: error

      - name: Upload full release folder
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-release-folder
          path: rustdesk/rustdesk/
          if-no-files-found: error
