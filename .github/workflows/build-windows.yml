name: Build Custom RustDesk for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'rustdesk-*'

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      RUST_VERSION: "1.75.0"
      LLVM_VERSION: "15.0.6"
      FLUTTER_VERSION: "3.24.5"

    steps:
      - name: Checkout source code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust (with rustfmt for frb)
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: rustdesk -> target

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Verify cmake (3.x is preinstalled on windows-2022)
        shell: cmd
        run: cmake --version

      - name: Install vcpkg and dependencies (ffmpeg required for hwcodec)
        shell: cmd
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if not exist C:\vcpkg\vcpkg.exe (
            if not exist C:\vcpkg (
              git clone --depth=1 https://github.com/microsoft/vcpkg C:\vcpkg
            )
            cd /d C:\vcpkg
            call bootstrap-vcpkg.bat -disableMetrics
          )
          cd /d %GITHUB_WORKSPACE%\rustdesk
          echo === vcpkg version ===
          C:\vcpkg\vcpkg.exe --version
          echo === Starting vcpkg install (this can take 30-50 min for ffmpeg + aom) ===
          C:\vcpkg\vcpkg.exe install --classic --triplet=x64-windows-static --overlay-ports=res/vcpkg/libvpx --overlay-ports=res/vcpkg/libyuv --overlay-ports=res/vcpkg/ffmpeg --overlay-ports=res/vcpkg/mfx-dispatch libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static ffmpeg:x64-windows-static
          if errorlevel 1 (
            echo ##[error]vcpkg install failed
            exit /b 1
          )
          echo === vcpkg install complete ===
        timeout-minutes: 60

      - name: Install flutter_rust_bridge_codegen
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Fetch Flutter dependencies
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk\flutter
          flutter pub get

      - name: Generate flutter_rust_bridge code
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk\flutter
          set PATH=%USERPROFILE%\.cargo\bin;%PATH%
          flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output ./lib/generated_bridge.dart --c-output ./windows/runner/bridge_generated.h

      - name: Build RustDesk (full: portable + flutter + hwcodec + vram)
        shell: cmd
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk
          echo === Starting cargo build (15-25 min) ===
          python build.py --portable --flutter --hwcodec --vram
          if errorlevel 1 (
            echo ##[error]build.py failed
            exit /b 1
          )
          if not exist flutter\build\windows\x64\runner\Release\rustdesk.exe (
            echo ##[error]Build failed - rustdesk.exe not found at flutter\build\windows\x64\runner\Release\rustdesk.exe
            dir flutter\build\windows\x64\runner\Release\
            exit /b 1
          )
          REM Move flutter output to ./rustdesk/ (mirrors official workflow)
          move /Y flutter\build\windows\x64\runner\Release rustdesk
          echo === Cargo build complete ===
        timeout-minutes: 120

      - name: Download usbmmidd driver (USB device redirection)
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk
          curl -L -o usbmmidd_v2.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          powershell -Command "Expand-Archive usbmmidd_v2.zip -DestinationPath ."
          powershell -Command "Remove-Item -Recurse -Force usbmmidd\Win32"
          powershell -Command "Remove-Item usbmmidd\deviceinstaller64.exe, usbmmidd\deviceinstaller.exe, usbmmidd\usbmmidd.bat"
          move /Y usbmmidd rustdesk
        timeout-minutes: 5

      - name: Download printer drivers
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk
          curl -L -o rustdesk_printer_driver.zip https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip
          curl -L -o printer_driver_adapter.zip https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip
          curl -L -o sha256sums https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums
          powershell -Command "Expand-Archive rustdesk_printer_driver.zip -DestinationPath ."
          powershell -Command "Expand-Archive printer_driver_adapter.zip -DestinationPath ."
          mkdir rustdesk\drivers
          move /Y rustdesk_printer_driver_v4-1.4 rustdesk\drivers\RustDeskPrinterDriver
          move /Y printer_driver_adapter.dll rustdesk\
          rmdir /S /Q rustdesk_printer_driver.zip printer_driver_adapter.zip sha256sums
        timeout-minutes: 5

      - name: Build self-extracting single-file portable (.exe)
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\rustdesk
          REM Edit manifest (matches official workflow)
          sed -i '/dpiAware/d' res\manifest.xml
          cd /d rustdesk\libs\portable
          pip install -r requirements.txt
          python generate.py -f ..\..\rustdesk\ -o . -e ..\..\rustdesk\rustdesk.exe
          if not exist target\release\rustdesk-portable-packer.exe (
            echo ##[error]Portable packer build failed
            exit /b 1
          )
          mkdir %GITHUB_WORKSPACE%\output
          move /Y target\release\rustdesk-portable-packer.exe %GITHUB_WORKSPACE%\output\rustdesk-1.4.9-x86_64.exe
        timeout-minutes: 15

      - name: List final output
        shell: cmd
        run: |
          echo === Final output dir ===
          dir %GITHUB_WORKSPACE%\output
          echo === rustdesk.exe ===
          dir %GITHUB_WORKSPACE%\rustdesk\rustdesk\rustdesk.exe

      - name: Upload single-file portable
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-portable
          path: output/rustdesk-1.4.9-x86_64.exe
          if-no-files-found: error

      - name: Upload full release folder (as backup)
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-release-folder
          path: rustdesk/rustdesk/
          if-no-files-found: error
